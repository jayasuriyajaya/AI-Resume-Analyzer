{% extends "base.html" %}

{% block title %}
Upload Resume - AI Resume Analyzer
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-sm border-0">

                <div class="card-body p-5">

                    <h2 class="fw-bold mb-2">
                        Upload Your Resume
                    </h2>

                    <p class="text-muted mb-4">
                        Upload your latest resume to receive
                        AI-powered analysis and job recommendations.
                    </p>

                    <form
                        method="POST"
                        enctype="multipart/form-data"
                    >

                        <div class="mb-4">

                            <label
                                for="resume"
                                class="form-label fw-semibold"
                            >
                                Resume File
                            </label>

                            <input
                                type="file"
                                class="form-control"
                                id="resume"
                                name="resume"
                                accept=".pdf,.docx"
                                required
                            >

                            <div class="form-text">
                                Supported formats: PDF, DOCX.
                                Maximum size: 5 MB.
                            </div>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary px-4"
                        >
                            Upload Resume
                        </button>

                        <a
                            href="{{ url_for('dashboard') }}"
                            class="btn btn-outline-secondary ms-2"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
